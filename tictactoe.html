<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      color: #e0aaff;
    }

    .scoreboard {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.2rem;
    }

    .score-box {
      text-align: center;
      background: #16213e;
      border-radius: 10px;
      padding: 0.6rem 1.4rem;
      min-width: 80px;
    }

    .score-box .label {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .score-box .value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .score-box.x .value  { color: #c77dff; }
    .score-box.o .value  { color: #48cae4; }
    .score-box.tie .value { color: #aaa; }

    .status {
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-bottom: 1.2rem;
      height: 1.6rem;
      transition: color 0.2s;
    }

    .status.x-turn  { color: #c77dff; }
    .status.o-turn  { color: #48cae4; }
    .status.win     { color: #f9c74f; font-weight: bold; }
    .status.draw    { color: #aaa; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.04);
    }

    .cell.x { color: #c77dff; }
    .cell.o { color: #48cae4; }

    .cell.winner {
      background: #2d1b69;
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.4rem;
    }

    button {
      padding: 0.55rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: translateY(-1px); }

    #btn-restart {
      background: #c77dff;
      color: #1a1a2e;
    }

    #btn-reset-scores {
      background: #16213e;
      color: #aaa;
      border: 1px solid #333;
    }

    .mode-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .mode-btn {
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      background: #16213e;
      color: #aaa;
      border: 1px solid #333;
    }

    .mode-btn.active {
      background: #c77dff;
      color: #1a1a2e;
      border-color: #c77dff;
    }
  </style>
</head>
<body>

  <h1>Tic-Tac-Toe</h1>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-2p">2 Players</button>
    <button class="mode-btn" id="btn-ai">vs Computer</button>
  </div>

  <div class="scoreboard">
    <div class="score-box x">
      <div class="label" id="x-label">Player X</div>
      <div class="value" id="score-x">0</div>
    </div>
    <div class="score-box tie">
      <div class="label">Draws</div>
      <div class="value" id="score-tie">0</div>
    </div>
    <div class="score-box o">
      <div class="label" id="o-label">Player O</div>
      <div class="value" id="score-o">0</div>
    </div>
  </div>

  <div class="status x-turn" id="status">Player X's turn</div>

  <div class="board" id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <div class="controls">
    <button id="btn-restart">New Game</button>
    <button id="btn-reset-scores">Reset Scores</button>
  </div>

  <script>
    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    let board, current, gameOver, vsAI;
    let scores = { X: 0, O: 0, tie: 0 };

    const cells   = document.querySelectorAll('.cell');
    const status  = document.getElementById('status');
    const scoreX  = document.getElementById('score-x');
    const scoreO  = document.getElementById('score-o');
    const scoreTie= document.getElementById('score-tie');
    const xLabel  = document.getElementById('x-label');
    const oLabel  = document.getElementById('o-label');

    function init() {
      board    = Array(9).fill(null);
      current  = 'X';
      gameOver = false;
      cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
      setStatus();
    }

    function setStatus(msg, cls) {
      if (msg) { status.textContent = msg; status.className = `status ${cls}`; return; }
      if (vsAI && current === 'O') {
        status.textContent = 'Computer is thinking…';
        status.className   = 'status o-turn';
      } else {
        status.textContent = `Player ${current}'s turn`;
        status.className   = `status ${current.toLowerCase()}-turn`;
      }
    }

    function checkWin(b, p) {
      return WINS.find(line => line.every(i => b[i] === p)) || null;
    }

    function handleClick(e) {
      const i = +e.target.dataset.i;
      if (gameOver || board[i] || (vsAI && current === 'O')) return;
      play(i);
      if (!gameOver && vsAI && current === 'O') {
        setTimeout(aiMove, 400);
      }
    }

    function play(i) {
      board[i] = current;
      const cell = cells[i];
      cell.textContent = current;
      cell.classList.add('taken', current.toLowerCase());

      const winLine = checkWin(board, current);
      if (winLine) {
        winLine.forEach(j => cells[j].classList.add('winner'));
        const who = (vsAI && current === 'O') ? 'Computer' : `Player ${current}`;
        setStatus(`${who} wins! 🎉`, 'win');
        scores[current]++;
        updateScores();
        gameOver = true;
        return;
      }

      if (board.every(v => v)) {
        setStatus("It's a draw!", 'draw');
        scores.tie++;
        updateScores();
        gameOver = true;
        return;
      }

      current = current === 'X' ? 'O' : 'X';
      setStatus();
    }

    function updateScores() {
      scoreX.textContent  = scores.X;
      scoreO.textContent  = scores.O;
      scoreTie.textContent = scores.tie;
    }

    // Minimax AI
    function aiMove() {
      const i = bestMove(board);
      play(i);
    }

    function minimax(b, isMax) {
      const w = checkWin(b, 'O');
      if (w) return 10;
      if (checkWin(b, 'X')) return -10;
      if (b.every(v => v)) return 0;

      if (isMax) {
        let best = -Infinity;
        b.forEach((v, i) => {
          if (!v) {
            b[i] = 'O';
            best = Math.max(best, minimax(b, false));
            b[i] = null;
          }
        });
        return best;
      } else {
        let best = Infinity;
        b.forEach((v, i) => {
          if (!v) {
            b[i] = 'X';
            best = Math.min(best, minimax(b, true));
            b[i] = null;
          }
        });
        return best;
      }
    }

    function bestMove(b) {
      let best = -Infinity, move = -1;
      b.forEach((v, i) => {
        if (!v) {
          b[i] = 'O';
          const score = minimax(b, false);
          b[i] = null;
          if (score > best) { best = score; move = i; }
        }
      });
      return move;
    }

    // Mode buttons
    document.getElementById('btn-2p').addEventListener('click', () => {
      vsAI = false;
      document.getElementById('btn-2p').classList.add('active');
      document.getElementById('btn-ai').classList.remove('active');
      xLabel.textContent = 'Player X';
      oLabel.textContent = 'Player O';
      scores = { X: 0, O: 0, tie: 0 };
      updateScores();
      init();
    });

    document.getElementById('btn-ai').addEventListener('click', () => {
      vsAI = true;
      document.getElementById('btn-ai').classList.add('active');
      document.getElementById('btn-2p').classList.remove('active');
      xLabel.textContent = 'You (X)';
      oLabel.textContent = 'Computer';
      scores = { X: 0, O: 0, tie: 0 };
      updateScores();
      init();
    });

    document.getElementById('btn-restart').addEventListener('click', init);

    document.getElementById('btn-reset-scores').addEventListener('click', () => {
      scores = { X: 0, O: 0, tie: 0 };
      updateScores();
      init();
    });

    cells.forEach(c => c.addEventListener('click', handleClick));

    // Start
    vsAI = false;
    init();
  </script>
</body>
</html>
